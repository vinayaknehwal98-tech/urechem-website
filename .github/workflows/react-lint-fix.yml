name: Apply React lint fixes

on:
  push:
    branches:
      - agent/security-hardening

permissions:
  contents: write

jobs:
  apply-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[lint bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening
          fetch-depth: 0

      - name: Apply targeted purity fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected source block was not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/contact/contact-enquiry-form.tsx",
              "  const startedAtRef = useRef(Date.now());",
              "  const startedAtRef = useRef(0);",
          )

          contact_old = (
              "  useEffect(() => {\n"
              "    if (!isConsultation) return;\n"
              "    const prefill = takeConsultationPrefill();\n"
              "    if (!prefill) return;\n\n"
              "    setForm((current) => ({\n"
              "      ...current,\n"
              "      name: current.name || prefill.name || \"\",\n"
              "      email: current.email || prefill.email || \"\",\n"
              "      mobile: current.mobile || prefill.mobile || \"\",\n"
              "      context: current.context || prefill.context || \"\",\n"
              "    }));\n"
              "  }, [isConsultation]);"
          )
          contact_new = (
              "  useEffect(() => {\n"
              "    startedAtRef.current = Date.now();\n"
              "    if (!isConsultation) return;\n\n"
              "    const prefill = takeConsultationPrefill();\n"
              "    if (!prefill) return;\n\n"
              "    const frame = window.requestAnimationFrame(() => {\n"
              "      setForm((current) => ({\n"
              "        ...current,\n"
              "        name: current.name || prefill.name || \"\",\n"
              "        email: current.email || prefill.email || \"\",\n"
              "        mobile: current.mobile || prefill.mobile || \"\",\n"
              "        context: current.context || prefill.context || \"\",\n"
              "      }));\n"
              "    });\n\n"
              "    return () => window.cancelAnimationFrame(frame);\n"
              "  }, [isConsultation]);"
          )
          replace_once("src/components/contact/contact-enquiry-form.tsx", contact_old, contact_new)

          hero_old = (
              "  useEffect(() => {\n"
              "    if (shouldReduceMotion) {\n"
              "      setHeroCanAnimate(true);\n"
              "      return;\n"
              "    }"
          )
          hero_new = (
              "  useEffect(() => {\n"
              "    if (shouldReduceMotion) {\n"
              "      const frame = window.requestAnimationFrame(() => setHeroCanAnimate(true));\n"
              "      return () => window.cancelAnimationFrame(frame);\n"
              "    }"
          )
          replace_once("src/components/home/hero-section.tsx", hero_old, hero_new)

          reveal_old = (
              "  useLayoutEffect(() => {\n"
              "    if (shouldReduceMotion) {\n"
              "      setIsVisible(true);\n"
              "      return;\n"
              "    }\n\n"
              "    const node = ref.current;\n"
              "    if (!node) {\n"
              "      setIsVisible(true);\n"
              "      return;\n"
              "    }\n\n"
              "    if (isNearViewport(node)) {\n"
              "      setIsVisible(true);\n"
              "      return;\n"
              "    }"
          )
          reveal_new = (
              "  useLayoutEffect(() => {\n"
              "    const revealOnNextFrame = () => {\n"
              "      const frameId = window.requestAnimationFrame(() => setIsVisible(true));\n"
              "      return () => window.cancelAnimationFrame(frameId);\n"
              "    };\n\n"
              "    if (shouldReduceMotion) return revealOnNextFrame();\n\n"
              "    const node = ref.current;\n"
              "    if (!node || isNearViewport(node)) return revealOnNextFrame();"
          )
          replace_once("src/components/motion/use-approach-reveal.ts", reveal_old, reveal_new)
          PY

          git diff --check

      - name: Commit targeted fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/contact/contact-enquiry-form.tsx src/components/home/hero-section.tsx src/components/motion/use-approach-reveal.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix React purity lint errors [lint bot]"
          git push origin HEAD:agent/security-hardening
