name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Security, lint, type, audits, build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Audit light-theme contrast coverage
        run: npm run audit:theme

      - name: Audit unique image usage
        run: npm run audit:images

      - name: Build production application
        run: npm run build

      - name: Scan source, history and browser bundles for secrets
        run: npm run audit:security

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/urechem-next.log 2>&1 &
          echo "$!" > /tmp/urechem-next.pid

      - name: Wait for production server
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/sitemap.xml >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/urechem-next.log
          exit 1

      - name: Smoke test every sitemap route
        run: npm run smoke:routes

      - name: Smoke test security controls
        run: npm run smoke:security

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/urechem-next.log || true
