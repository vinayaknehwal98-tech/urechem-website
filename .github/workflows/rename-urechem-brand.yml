name: Rename Urechem brand everywhere

on:
  push:
    paths:
      - ".github/workflows/rename-urechem-brand.yml"

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace singular company name across website source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("src"), Path("public")]
          root_files = [Path("next.config.ts"), Path("next.config.js")]
          text_extensions = {
              ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".json",
              ".md", ".mdx", ".txt", ".html", ".css", ".scss", ".xml",
              ".svg", ".webmanifest", ".yml", ".yaml"
          }

          patterns = [
              (re.compile(r"\bURECHEM CHEMICAL'S\b"), "URECHEM CHEMICALS'"),
              (re.compile(r"\bUrechem Chemical's\b"), "Urechem Chemicals'"),
              (re.compile(r"\burechem chemical's\b"), "urechem chemicals'"),
              (re.compile(r"\bURECHEM CHEMICAL\b(?!S)"), "URECHEM CHEMICALS"),
              (re.compile(r"\bUrechem Chemical\b(?!s)"), "Urechem Chemicals"),
              (re.compile(r"\burechem chemical\b(?!s)"), "urechem chemicals"),
          ]

          candidates = []
          for root in roots:
              if root.exists():
                  candidates.extend(
                      path for path in root.rglob("*")
                      if path.is_file() and path.suffix.lower() in text_extensions
                  )
          candidates.extend(path for path in root_files if path.exists())

          changed = []
          for path in sorted(set(candidates)):
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = original
              for pattern, replacement in patterns:
                  updated = pattern.sub(replacement, updated)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated files:")
          print("\n".join(changed) if changed else "No matching files found")
          PY

      - name: Commit website-wide naming update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public next.config.ts next.config.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No website files required changes."
            exit 0
          fi
          git commit -m "Rename Urechem Chemical to Urechem Chemicals site-wide"
          git push origin HEAD:main
