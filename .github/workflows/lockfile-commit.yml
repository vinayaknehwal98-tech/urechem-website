name: Commit patched dependency lockfile

on:
  push:
    branches:
      - agent/security-hardening

permissions:
  contents: write

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Regenerate compatible lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair dependency lockfile [lockfile bot]"
          git push origin HEAD:agent/security-hardening
