name: Review Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-screenshots.yml'

jobs:
  capture:
    name: Capture production-review screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Install Chromium and Playwright test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/urechem-next.log 2>&1 &
          echo "$!" > /tmp/urechem-next.pid

      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/products >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/urechem-next.log
          exit 1

      - name: Check browser console, page errors and same-origin requests
        run: |
          cat > browser-console-smoke.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          const baseUrl = 'http://127.0.0.1:3000';
          const routes = [
            '/',
            '/products',
            '/contact',
            '/consultant',
            '/ai-solution-finder',
            '/ask-urechem-ai',
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 900 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          function attachFailureCollection(page, findings) {
            page.on('console', (message) => {
              if (message.type() === 'error') findings.push(`console: ${message.text()}`);
            });
            page.on('pageerror', (error) => findings.push(`pageerror: ${error.message}`));
            page.on('requestfailed', (request) => {
              if (!request.url().startsWith(baseUrl)) return;
              const reason = request.failure()?.errorText ?? 'unknown request failure';
              if (reason.includes('ERR_ABORTED')) return;
              findings.push(`requestfailed: ${request.method()} ${request.url()} (${reason})`);
            });
            page.on('response', (response) => {
              if (response.url().startsWith(baseUrl) && response.status() >= 400) {
                findings.push(`http ${response.status()}: ${response.url()}`);
              }
            });
          }

          for (const [label, viewport] of viewports) {
            for (const route of routes) {
              test(`${label} ${route} has no browser errors`, async ({ page }) => {
                const findings = [];
                attachFailureCollection(page, findings);
                await page.setViewportSize(viewport);
                const response = await page.goto(`${baseUrl}${route}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 30_000,
                });
                expect(response?.status()).toBe(200);
                await page.waitForTimeout(route === '/' ? 4_000 : 1_500);
                expect(findings).toEqual([]);
              });
            }
          }

          test('both AI interfaces use the protected endpoint successfully', async ({ page }) => {
            const findings = [];
            attachFailureCollection(page, findings);

            await page.goto(`${baseUrl}/ai-solution-finder`, { waitUntil: 'domcontentloaded' });
            await page.locator('textarea').first().fill('Closed-cell roof insulation for a commercial building');
            const finderResponsePromise = page.waitForResponse(
              (response) => response.url().endsWith('/api/ai/solution') && response.request().method() === 'POST',
            );
            await page.getByRole('button', { name: /find relevant pathways/i }).click();
            expect((await finderResponsePromise).status()).toBe(200);

            await page.goto(`${baseUrl}/ask-urechem-ai`, { waitUntil: 'domcontentloaded' });
            await page.locator('textarea').first().fill('Water ingress through a concrete construction joint');
            const assistantResponsePromise = page.waitForResponse(
              (response) => response.url().endsWith('/api/ai/solution') && response.request().method() === 'POST',
            );
            await page.getByRole('button', { name: /ask urechem ai/i }).click();
            expect((await assistantResponsePromise).status()).toBe(200);
            expect(findings).toEqual([]);
          });
          EOF

          npx playwright test browser-console-smoke.spec.cjs --workers=1 --reporter=line
          rm browser-console-smoke.spec.cjs

      - name: Capture full-page desktop and mobile screenshots
        run: |
          mkdir -p review-screenshots/latest
          routes=(
            "home:/"
            "products:/products"
            "complete-range:/products/complete-range"
            "tpu-materials:/products/tpu-materials"
            "ureshield:/products/ureshield-waterproofing-polyurea-systems"
            "product-family:/products/uretherm-spray-foam-systems"
            "product-page:/products/uretherm-spray-foam-systems/uretherm-spray-foam-systems-gt-40"
            "products-compare:/products/compare"
            "applications:/applications"
            "application-page:/applications/automotive-seating"
            "industries:/industries"
            "technical-center:/technical-center"
            "testing-validation:/technical-center/testing-validation"
            "about:/about"
            "innovation-rd:/innovation-rd"
            "contact:/contact?type=TDS%20request&product=UreShield%201K%20PU-M"
          )
          for route in "${routes[@]}"; do
            name="${route%%:*}"
            path="${route#*:}"
            npx playwright screenshot --browser=chromium --full-page --viewport-size=1440,900 --wait-for-timeout=1200 "http://127.0.0.1:3000${path}" "review-screenshots/latest/${name}-desktop.png"
            npx playwright screenshot --browser=chromium --full-page --viewport-size=390,844 --wait-for-timeout=1200 "http://127.0.0.1:3000${path}" "review-screenshots/latest/${name}-mobile.png"
          done

      - name: Capture homepage image sections after anchor navigation
        run: |
          sections=(
            "home-pathways:/#choose-your-path"
            "home-product-universe:/#product-universe"
            "home-ureshield:/#ureshield"
            "home-applications:/#applications"
            "home-proof:/#proof-expertise"
            "home-workflow:/#workflow"
            "home-technical:/#technical-center-preview"
          )
          for section in "${sections[@]}"; do
            name="${section%%:*}"
            path="${section#*:}"
            npx playwright screenshot --browser=chromium --viewport-size=1440,900 --wait-for-timeout=1800 "http://127.0.0.1:3000${path}" "review-screenshots/latest/${name}-desktop.png"
            npx playwright screenshot --browser=chromium --viewport-size=390,844 --wait-for-timeout=1800 "http://127.0.0.1:3000${path}" "review-screenshots/latest/${name}-mobile.png"
          done

      - name: Capture opening animation checkpoints
        run: |
          desktop_checkpoints=(450 1000 1500 2200 2800 3400)
          for checkpoint in "${desktop_checkpoints[@]}"; do
            npx playwright screenshot --browser=chromium --viewport-size=1440,900 --wait-for-timeout="${checkpoint}" "http://127.0.0.1:3000/?intro=force&checkpoint=${checkpoint}" "review-screenshots/latest/opening-${checkpoint}ms-desktop.png"
          done

          mobile_checkpoints=(650 1450 2400 3400)
          for checkpoint in "${mobile_checkpoints[@]}"; do
            npx playwright screenshot --browser=chromium --viewport-size=390,844 --wait-for-timeout="${checkpoint}" "http://127.0.0.1:3000/?intro=force&checkpoint=${checkpoint}" "review-screenshots/latest/opening-${checkpoint}ms-mobile.png"
          done

      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: production-review-screenshots
          path: review-screenshots/latest/*.png
          if-no-files-found: error

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/urechem-next.log || true
